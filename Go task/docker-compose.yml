version: '3.9'

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: scooters
      POSTGRES_USER: scooter
      POSTGRES_PASSWORD: scooter
    ports:
      - "5432:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

  app:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgres://scooter:scooter@db:5432/scooters?sslmode=disable"
    ports:
      - "8080:8080"
    restart: unless-stopped
